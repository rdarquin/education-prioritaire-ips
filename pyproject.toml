description = "Le classement en éducation prioritaire (REP, REP+) confronté à la réalité sociale et scolaire des collèges publics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartiflette>=0.1.9",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "typst>=0.15.0",
]
